# PLAN B DE BACKUP (dueño, 02/10): todos los días a las 03:47 de Argentina.
# Desde el 09/10 lo LANZA EL SISTEMA (core/backup_github.py), porque los
# horarios de GitHub salían entre 6 y 8 horas tarde; los dos `schedule` de
# abajo quedan de respaldo.
#
# Código, bases (Frutamax, Palmala, Ganadería) y fotos van a OneDrive Y a
# Google Drive, CIFRADOS con la clave que Lionel tiene impresa. SIN ESA CLAVE
# EL BACKUP NO SIRVE: nadie puede abrir lo que hay en las nubes.
#
# Cada parte graba cómo le fue en `backups_corridas` (Frutamax y Palmala), y
# Gerencia → Backups lo muestra. Una corrida en rojo acá es una parte que no
# llegó a los dos destinos: la pantalla dice cuál. Nada de mails.
#
# Las credenciales son TODAS secrets del repo (la guía dice de dónde sale cada
# una). Ninguna va en un archivo. RESTAURAR.md dice cómo se vuelve todo.
name: Backup

on:
  # GitHub NO garantiza los schedule: con carga los atrasa o los DESCARTA. Del
  # 04/10 al 08/10 los dos salieron TODOS los días entre 6 y 8 horas y media
  # tarde (el de las 03:47 corría a las 11). Por eso, desde el 09/10:
  #   - a las 03:47 de Argentina lo lanza el SISTEMA (workflow_dispatch con
  #     origen "sistema"), que sale en el momento;
  #   - los dos schedule quedan de RESPALDO: cualquiera de los dos solo hace el
  #     backup si hoy (Argentina) todavía no hubo ninguno bueno.
  schedule:
    - cron: "47 6 * * *"    # 06:47 UTC = 03:47 de Argentina (respaldo)
    - cron: "17 10 * * *"   # 10:17 UTC = 07:17 de Argentina (respaldo)
  workflow_dispatch:
    inputs:
      origen:
        description: "quién lo lanza: a_mano (siempre corre) o sistema (se saltea si hoy ya hubo uno bueno)"
        required: false
        default: a_mano

# Una corrida a la vez: dos juntas se pisarían el token renovado de OneDrive.
concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  RCLONE_CONFIG: ${{ github.workspace }}/../rclone.conf
  BACKUP_CLAVE: ${{ secrets.BACKUP_CLAVE }}
  ESTADO_FRUTAMAX_URL: ${{ secrets.ESTADO_FRUTAMAX_URL }}
  ESTADO_PALMALA_URL: ${{ secrets.ESTADO_PALMALA_URL }}

jobs:
  # ¿HACE FALTA? Lanzado a mano desde GitHub, siempre. Lanzado por el sistema
  # o por un schedule, solo si hoy (Argentina) todavía no hubo un Backup que
  # terminó bien. Como corren de a uno (concurrency), si el sistema lo lanza
  # dos veces (Frutamax y Palmala) el segundo encuentra el bueno y se saltea.
  # Si la consulta a GitHub falla, se hace el backup igual: uno de más no rompe
  # nada (las diarias llevan la fecha en el nombre y las fotos son
  # incrementales).
  hace_falta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      correr: ${{ steps.decidir.outputs.correr }}
    steps:
      - id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ORIGEN: ${{ github.event.inputs.origen }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$ORIGEN" != "sistema" ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"; echo "lanzado a mano: se hace"; exit 0
          fi
          desde=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%dT00:00:00-03:00)
          if n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/backup.yml/runs" \
                   -f status=success -f created=">=$desde" --jq .total_count); then
            echo "Backups buenos desde $desde: $n"
            if [ "$n" -gt 0 ]; then echo "correr=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          else
            echo "No se pudo preguntar a GitHub: se hace el backup igual"
          fi
          echo "correr=true" >> "$GITHUB_OUTPUT"

  codigo:
    needs: hace_falta
    if: needs.hace_falta.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # la historia ENTERA y todas las ramas: el bundle es --all
      - uses: ./.github/acciones/preparar-backup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - run: python scripts/backup.py codigo
      - uses: ./.github/acciones/guardar-token
        if: always()

  bases:
    needs: [hace_falta, codigo]
    # que falle el código no frena las bases; que no haga falta, sí
    if: always() && needs.hace_falta.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # EL POSTGRES DESCARTABLE: cada base bajada de cada nube se restaura acá
      # y se cuenta contra el origen. Si no da igual, esa parte NO es exitosa.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      BACKUP_PRUEBA_URL: postgresql://postgres:prueba@127.0.0.1:5432/postgres
      FRUTAMAX_DB_URL: ${{ secrets.FRUTAMAX_DB_URL }}
      PALMALA_DB_URL: ${{ secrets.PALMALA_DB_URL }}
      GANADERIA_DB_URL: ${{ secrets.GANADERIA_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/acciones/preparar-backup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      # Las tres bases son PostgreSQL 17: pg_dump tiene que ser 17 o más nuevo.
      - name: Cliente de PostgreSQL 17
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version && python scripts/backup.py bases
      - uses: ./.github/acciones/guardar-token
        if: always()

  fotos:
    needs: [hace_falta, bases]
    if: always() && needs.hace_falta.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRUTAMAX_S3_KEY_ID: ${{ secrets.FRUTAMAX_S3_KEY_ID }}
      FRUTAMAX_S3_SECRET: ${{ secrets.FRUTAMAX_S3_SECRET }}
      FRUTAMAX_S3_REGION: ${{ secrets.FRUTAMAX_S3_REGION }}
      PALMALA_S3_KEY_ID: ${{ secrets.PALMALA_S3_KEY_ID }}
      PALMALA_S3_SECRET: ${{ secrets.PALMALA_S3_SECRET }}
      PALMALA_S3_REGION: ${{ secrets.PALMALA_S3_REGION }}
      GANADERIA_S3_KEY_ID: ${{ secrets.GANADERIA_S3_KEY_ID }}
      GANADERIA_S3_SECRET: ${{ secrets.GANADERIA_S3_SECRET }}
      GANADERIA_S3_REGION: ${{ secrets.GANADERIA_S3_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/acciones/preparar-backup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - run: python scripts/backup.py fotos
      - uses: ./.github/acciones/guardar-token
        if: always()
