<input type="hidden" name="cantidad_renglones" value="{{ renglones|length }}">
<input type="hidden" name="foto_preview" value="{{ foto_preview }}">
<!-- Token único por comanda: si el guardado se reintenta (corte de
     internet), el server lo reconoce y no duplica nada. -->
<input type="hidden" name="carga_token" value="{{ carga_token or "" }}">

{% if foto_preview %}
<div id="modal-foto" class="modal-foto" onclick="cerrarFoto(event)">
  <div class="modal-foto-contenido">
    <img src="{{ foto_preview }}" alt="Foto de la comanda">
    <button type="button" class="modal-foto-cerrar" onclick="cerrarFoto(event)">Cerrar</button>
  </div>
</div>
{% endif %}

{% include "_fragmento_proveedor_comanda.html" %}

<div id="renglones-comanda">
{% include "_fragmento_renglones_comanda.html" %}
</div>
